<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADB Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ADB Console</h1>
    </header>
    <main>
        <div> <!-- command palette field -->
            <h2>Command Palette</h2>
            <div class="console">
                &gt;
                <select id="command-name">
                    <option value="adb/shell" selected>adb shell</option>
                </select>
                <input type="text" id="command-arguments" placeholder="Enter command arguments" size="64" />
                <button id="command-post">POST</button>
            </div>
            <menu class="vertical-option-menu">
                <li>
                    <input type="checkbox" id="clear-result" checked />
                    <label for="clear-result">Clears all result before post the command.</label>
                </li>
            </menu>
            <div id="command-error" class="hide"></div>
        </div>
        <div> <!-- devices list field -->
            <h2>Devices List</h2>
            <div id="devices-list-contaier"></div>
        </div>
    </main>
    <footer></footer>
</body>
<script src="main.js" type="module"></script>
</html>

name: Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write # カバレッジバッジのコミットに必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Calculated Coverage: $COVERAGE"
          
          NUM=$(echo $COVERAGE | tr -d '%')
          COLOR="orange"
          
          INT_NUM=${NUM%.*}
          if [ -n "$INT_NUM" ]; then
            if [ "$INT_NUM" -ge 80 ]; then
              COLOR="brightgreen"
            elif [ "$INT_NUM" -ge 50 ]; then
              COLOR="yellow"
            elif [ "$INT_NUM" -ge 20 ]; then
              COLOR="yellowgreen"
            fi
          fi

          curl -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/75da47576ae3375365776b165bc29d48" \
            -d "{\"files\":{\"coverage.json\":{\"content\":\"{\\\"schemaVersion\\\":1,\\\"label\\\":\\\"coverage\\\",\\\"message\\\":\\\"${COVERAGE}\\\",\\\"color\\\":\\\"${COLOR}\\\"}\"}}}"
     

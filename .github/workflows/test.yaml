name: Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write # カバレッジバッジのコミットに必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Generate Self-Signed Certificates
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout internal/infra/server/assets/key.pem \
            -out internal/infra/server/assets/cert.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: tj-actions/coverage-badge-go@v2
        with:
          filename: coverage.out

      - name: Commit & Push Badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: 'coverage.svg'
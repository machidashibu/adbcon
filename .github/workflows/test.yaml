name: Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write # カバレッジバッジのコミットに必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Generate Self-Signed Certificates
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout internal/infra/server/assets/key.pem \
            -out internal/infra/server/assets/cert.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          # coverage.out からトータルのパーセンテージ（例: 29.6%）を取得
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Calculated Coverage: $COVERAGE"
          
          # 数値を取り出してパーセンテージに応じて色を決定
          NUM=$(echo $COVERAGE | tr -d '%')
          COLOR="orange"
          
          # bashの数値比較 (整数変換)
          INT_NUM=${NUM%.*}
          if [ -n "$INT_NUM" ]; then
            if [ "$INT_NUM" -ge 80 ]; then
              COLOR="brightgreen"
            elif [ "$INT_NUM" -ge 50 ]; then
              COLOR="yellow"
            elif [ "$INT_NUM" -ge 20 ]; then
              COLOR="yellowgreen"
            fi
          fi

          # Shields.io 形式の SVG を作成して coverage.svg に保存
          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}-${COLOR}.svg" > coverage.svg

      - name: Commit & Push Badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: 'coverage.svg'